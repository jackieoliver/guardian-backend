[project]
name = "guardianbackend"
version = "0.1.0"
description = "Polyglot backend foundation for Guardian recording ingestion and storage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "google-auth>=2.41.1",
    "google-cloud-firestore>=2.26.0",
    "google-cloud-storage>=3.10.1",
    "google-cloud-tasks>=2.22.0",
    "pydantic-settings>=2.11.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/guardianbackend/api/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
strict = true
packages = ["guardianbackend"]

[[tool.mypy.overrides]]
module = ["google.cloud.storage"]
ignore_missing_imports = true
